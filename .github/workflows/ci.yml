name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux are the v1 desktop targets. They also differ in the platform
        # crypto library, which is what decides whether the BCL ChaCha20-Poly1305 path is
        # exercised at all — so the cross-check against the managed implementation only
        # runs on both if the matrix does.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UniProtocol.slnx

      - name: Build
        run: dotnet build UniProtocol.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test UniProtocol.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  aot:
    name: AOT publish the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The client library ships into trimmed and AOT-published apps, so a publish that
      # fails here is a bug that would otherwise only surface on a user's Android build.
      - name: Publish
        run: dotnet publish src/UniProtocol.Cli --configuration Release -r linux-x64

      - name: Smoke test
        run: |
          ./src/UniProtocol.Cli/bin/Release/net10.0/linux-x64/publish/unip keygen --path "$RUNNER_TEMP/node.key"
          ./src/UniProtocol.Cli/bin/Release/net10.0/linux-x64/publish/unip show --path "$RUNNER_TEMP/node.key"
